; ========================================
; POLYBAR CONFIG - Minimalist Orange Theme
; ========================================

[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #ff8c00  ; The distinct orange from the image
secondary = #89b4fa
alert = #f38ba8
disabled = #6c7086

[bar/main]
width = 100%
height = 33
radius = 0

; Make it stick to the top (or bottom if you prefer)
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 0

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

; Fonts (Ensure JetBrains Mono Nerd Font is installed)
font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2
font-2 = JetBrainsMono Nerd Font:size=14;3

; The layout matches the image
modules-left = launcher xworkspaces
modules-center = date
modules-right = systray controlcenter cpu memory pulseaudio battery powermenu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; ========================
; MODULES: Left
; ========================

[module/launcher]
type = custom/text
format = <label>
label = "  "
label-font = 2
label-background = #ff8c00
label-foreground = #1e1e2e
label-padding = 1
click-left = rofi -show drun -theme ~/.config/rofi/launcher.rasi

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

; ========================
; MODULES: Center
; ========================

; ========================
; MODULES: Right
; ========================

[module/controlcenter]
type = custom/text
format = <label>
label = " 󰒓 "
label-foreground = ${colors.primary}
label-padding = 1
click-left = ~/.config/rofi/quicksettings.sh

[module/systray]
type = internal/tray
tray-spacing = 8pt
tray-padding = 5px
tray-background = ${colors.background}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
; Important: Check your actual battery interface by running `ls /sys/class/power_supply/`
; It might be BAT0, BAT1, or macsmc-battery
battery = BAT1
adapter = ACAD
full-at = 100
low-at = 35

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1

; The Omarchy format (Day Name + 12-hour Time)
date = %A
time = %I:%M %p

; format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %date% %time%
label-foreground = ${colors.foreground}

[module/powermenu]
type = custom/text
format = <label>
label = "  "
label-background = #ff8c00
label-foreground = #1e1e2e
label-padding = 2
click-left = ~/.config/rofi/powermenu.sh

; ========================
; SETTINGS
; ========================
[settings]
screenchange-reload = true
pseudo-transparency = true
