# background
background {
    monitor = eDP-1
    path = /path/to/your/wallpaper.jpg
    blur_passes = 3
    blur_size = 5
}

# clock
label {
    text = $TIME
    font_size = 48
    color = rgba(255,255,255,0.8)
    position = 0,100
    halign = center
}

# password field
input-field {
    size = 300,50
    outline_thickness = 2
    dots_size = 0.3
    dots_margin = 1
    invert_mode = false
}

